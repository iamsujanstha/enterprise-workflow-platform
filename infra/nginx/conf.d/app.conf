# ─────────────────────────────────────────────────────────────────────────────
# conf.d/app.conf  —  Local / staging reverse proxy
# All traffic comes in on :80 and is routed to backend or frontend.
# In production swap this file with api.conf (TLS + Let's Encrypt).
# ─────────────────────────────────────────────────────────────────────────────

# Next.js upstream
upstream frontend_app {
    server frontend:3001;
    keepalive 32;
}

# NestJS upstream  (add more instances here for scaling)
upstream backend_api {
    least_conn;
    server backend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # ── Global proxy headers ──────────────────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ── API — routed to NestJS ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_api;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Buffer tuning
        proxy_buffering       on;
        proxy_buffer_size     4k;
        proxy_buffers         8 4k;
    }

    # ── Auth — stricter rate limiting ─────────────────────────────────────────
    location /api/v1/auth/ {
        proxy_pass http://backend_api;
        limit_req  zone=auth_limit burst=20 nodelay;
        limit_req_status 429;
    }

    # ── Next.js HMR WebSocket (dev only) ─────────────────────────────────────
    location /_next/webpack-hmr {
        proxy_pass http://frontend_app;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Next.js static assets — aggressive caching ───────────────────────────
    location /_next/static/ {
        proxy_pass http://frontend_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Frontend — everything else goes to Next.js ───────────────────────────
    location / {
        proxy_pass http://frontend_app;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";   # support Next.js streaming

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── Internal health check endpoint ────────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
