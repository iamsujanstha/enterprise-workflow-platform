# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.dev.yml  —  DEV OVERRIDES
#
# Run:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────────────────────

services:

  backend:
    build:
      target: builder           # stop at builder stage — skip optimized runner
    command: npm run start:dev  # hot-reload with nest watch
    environment:
      NODE_ENV: development
    volumes:
      - ../../apps/backend/src:/app/src:ro    # mount source for hot-reload
      - ../../apps/backend/.env:/app/.env:ro
    ports:
      - "3010:3000"             # expose directly for Postman / curl in dev (host:container)
      - "9229:9229"             # Node debugger port
    healthcheck:
      disable: true             # builder image has no wget; app health verified via curl on host

  frontend:
    build:
      target: builder
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3010   # dev: backend exposed on host port 3010
    command: npm run dev        # next dev with HMR
    environment:
      NODE_ENV: development
    volumes:
      - ../../apps/frontend/src:/app/src:ro   # mount source for HMR
    ports:
      - "3011:3001"             # expose directly for browser in dev (host:container)

  mongo:
    ports:
      - "27018:27017"           # expose for MongoDB Compass (host 27018 → container 27017)

  redis:
    ports:
      - "6380:6379"             # expose for Redis Insight / CLI (host 6380 → container 6379)

  nginx:
    profiles:
      - prod                    # disable nginx in dev — hit services directly
