version: '3.8'

services:
  # Backend Auth API
  backend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.backend
    ports:
      - "3000:3000"
    env_file:
      - ../../apps/backend/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/backend/src:/app/src:ro
    command: npm run start:dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/auth/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Frontend
  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ../../apps/frontend/src:/app/src
    command: npm run dev

  # Worker
  worker:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile.worker
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/enterprise-workflow
      - REDIS_URL=redis://redis:6379
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
    depends_on:
      - mongo
      - redis
    command: npm run start:worker

  # MongoDB
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=auth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Nginx (optional - for production-like setup)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend
      - frontend

volumes:
  mongo_data:
  redis_data:
